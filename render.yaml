# Render blueprint — https://render.com/docs/blueprint-spec
#
# Either point Render at this file (New -> Blueprint) or configure the same
# settings by hand in the dashboard. Secrets are marked sync:false so Render
# prompts for them instead of expecting them in the repo.
services:
  - type: web
    name: automated-email-ai   # becomes https://automated-email-ai.onrender.com
    runtime: python
    plan: free
    rootDir: backend           # the repo root is still cloned, so ../ml is available
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY          # service_role key
        sync: false
      # AI provider chain (app/services/llm.py). GROQ_API_KEY alone is enough;
      # see backend/.env.example for the optional providers and AI_PROVIDERS.
      - key: GROQ_API_KEY            # https://console.groq.com/keys
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON   # contents of backend/credentials.json, one line
        sync: false
      - key: OAUTH_REDIRECT_URI        # https://<this-service>.onrender.com/api/v1/actions/callback
        sync: false
      - key: ALLOWED_ORIGINS           # https://<your-app>.vercel.app
        sync: false
      - key: FRONTEND_URL              # https://<your-app>.vercel.app - where OAuth returns to
        sync: false
      # Email for signup / password-reset codes. Render blocks outbound SMTP,
      # so use an HTTP provider here rather than SMTP_*.
      - key: BREVO_API_KEY           # https://app.brevo.com/settings/keys/api
        sync: false
      - key: MAIL_FROM               # a sender address verified with Brevo
        sync: false
      # Optional, and only consulted when no Brevo/Resend key is present. It is
      # what enables sending through a linked user's Gmail at all: without it
      # that transport is unavailable, because the deployment must not help
      # itself to whichever mailbox happens to be linked.
      - key: MAIL_GMAIL_PROFILE_ID   # a profiles.id whose Gmail token has the send scope
        sync: false
